<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Beyond the Algorithm">
  <!-- Two overlapping cards (Domain / Tech) behind a gear: the game's
       central tension rendered as a mark. -->
  <rect x="6" y="12" width="30" height="40" rx="5" transform="rotate(-8 21 32)"
        fill="#ffe8c7" stroke="#f3cc92" stroke-width="2"/>
  <rect x="28" y="12" width="30" height="40" rx="5" transform="rotate(8 43 32)"
        fill="#d0ebeb" stroke="#8fc7cc" stroke-width="2"/>
  <g transform="translate(32 32)">
    <circle r="11.5" fill="#f5efec" stroke="#081912" stroke-width="2"/>
    <circle r="4" fill="none" stroke="#081912" stroke-width="2"/>
    <g fill="#081912">
      <rect x="-1.9" y="-14.5" width="3.8" height="4.6" rx="1"/>
      <rect x="-1.9" y="9.9" width="3.8" height="4.6" rx="1"/>
      <rect x="-14.5" y="-1.9" width="4.6" height="3.8" rx="1"/>
      <rect x="9.9" y="-1.9" width="4.6" height="3.8" rx="1"/>
      <rect x="-1.9" y="-14.5" width="3.8" height="4.6" rx="1" transform="rotate(45)"/>
      <rect x="-1.9" y="9.9" width="3.8" height="4.6" rx="1" transform="rotate(45)"/>
      <rect x="-14.5" y="-1.9" width="4.6" height="3.8" rx="1" transform="rotate(45)"/>
      <rect x="9.9" y="-1.9" width="4.6" height="3.8" rx="1" transform="rotate(45)"/>
    </g>
  </g>
</svg>
